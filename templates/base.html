<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RSS Feed Reader{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='reader.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='forms.js') }}" defer></script>
</head>
<body>
    <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
    <header class="border-bottom mb-4">
        <nav class="container py-3" aria-label="Main navigation">
            <a class="fw-bold text-decoration-none" href="{{ url_for('web.home') }}">RSS Feed Reader</a>
        </nav>
    </header>
    <main id="main-content" class="container pb-5">
        {% include '_flashes.html' %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
