{% extends 'base.html' %}
{% block title %}Edit feed · RSS Feed Reader{% endblock %}
{% block content %}
<h1 class="mb-4">Edit feed</h1>
<form method="post" action="{{ url_for('web.edit_feed', feed_id=feed.id) }}" data-busy-label="Saving…">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="title" class="form-label">Title (required)</label>
        <input type="text" class="form-control{% if title_error %} is-invalid{% endif %}" id="title" name="title" value="{{ feed.title }}" required{% if title_error %} aria-invalid="true" aria-describedby="title-error"{% endif %}>
        {% if title_error %}<p id="title-error" class="invalid-feedback">Enter a title for this feed.</p>{% endif %}
    </div>
    <div class="mb-3">
        <label for="subtitle" class="form-label">Subtitle (optional)</label>
        <input type="text" class="form-control" id="subtitle" name="subtitle" value="{{ feed.subtitle }}">
    </div>
    <div class="mb-3">
        <label for="generator" class="form-label">Generator (optional)</label>
        <input type="text" class="form-control" id="generator" name="generator" value="{{ feed.generator }}">
    </div>
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn btn-link" href="{{ url_for('web.home') }}">Cancel</a>
    <p class="small mt-2" role="status" data-submit-status></p>
</form>
{% endblock %}
